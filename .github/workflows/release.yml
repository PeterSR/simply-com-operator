# Publishes a release when a v* tag is pushed; RELEASING.md describes the process. In order:
#
#   test     the checks of test.yml, run again on the tagged commit
#   image    ghcr.io/petersr/simply-com-operator for linux/amd64 and linux/arm64, signed with
#            cosign and with build provenance when the repository is public
#   chart    the Helm chart, pushed to oci://ghcr.io/petersr/charts once the image exists
#   release  a GitHub release with the notes from CHANGELOG.md and the CRDs as crds.yaml
#
# A tag with a suffix, such as v0.2.0-rc.1, is a prerelease: the image gets only its own tag, and
# neither latest nor X.Y moves.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# GHCR names must be lowercase, so they are written out rather than derived from the repository.
env:
  IMAGE: ghcr.io/petersr/simply-com-operator
  CHART_REPO: oci://ghcr.io/petersr/charts
  CHART: ghcr.io/petersr/charts/simply-com-operator

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  image:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: version from the tag
        run: |
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq "^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$id(\.$id)*)?\$"; then
            echo "::error::$GITHUB_REF_NAME is not a version tag such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          case $version in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "minor=$(printf '%s' "$version" | cut -d. -f1-2)"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - id: tags
        name: image tags
        run: |
          tags="$IMAGE:$GITHUB_REF_NAME,$IMAGE:$VERSION"
          if [ "$PRERELEASE" = false ]; then
            tags="$tags,$IMAGE:$MINOR,$IMAGE:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=A Kubernetes operator for Simply.com DNS records
      # Keyless signatures and attestations go to public transparency logs, which would name a
      # private repository, so a private repository releases unsigned.
      - if: github.event.repository.private == false
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: sign the image
        if: github.event.repository.private == false
        run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: attest the image
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      - id: package
        name: package and push the chart
        run: |
          sed -i "s/^  artifacthub.io\/prerelease: .*/  artifacthub.io\/prerelease: \"$PRERELEASE\"/" charts/simply-com-operator/Chart.yaml
          helm package charts/simply-com-operator --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP"
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/simply-com-operator-$VERSION.tgz" "$CHART_REPO" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest=$(sed -n 's/^Digest: \(sha256:[0-9a-f]*\)$/\1/p' "$RUNNER_TEMP/push.log")
          if [ -z "$digest" ]; then
            echo "::error::helm push printed no digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ needs.image.outputs.version }}
          PRERELEASE: ${{ needs.image.outputs.prerelease }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event.repository.private == false
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      # cosign reads the Docker credentials, not the ones helm registry login wrote.
      - if: github.event.repository.private == false
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: sign the chart
        if: github.event.repository.private == false
        run: cosign sign --yes "$CHART@$DIGEST"
        env:
          DIGEST: ${{ steps.package.outputs.digest }}

  release:
    needs: [image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: notes and CRDs
        run: |
          hack/changelog-section.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          for crd in config/crd/bases/*.yaml; do
            echo '---'
            cat "$crd"
          done > "$RUNNER_TEMP/crds.yaml"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ needs.image.outputs.prerelease == 'true' }}
          files: ${{ runner.temp }}/crds.yaml
