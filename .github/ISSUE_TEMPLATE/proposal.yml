name: Proposal
description: A new feature, or support for more of the Simply.com API.
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do that the operator makes hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What you would add or change, and how it would look as a resource.
    validations:
      required: true
