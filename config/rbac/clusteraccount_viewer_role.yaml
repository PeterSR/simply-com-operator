# This rule is not used by the project simply-com-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to simplycom.petersr.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: simply-com-operator
    app.kubernetes.io/managed-by: kustomize
  name: clusteraccount-viewer-role
rules:
- apiGroups:
  - simplycom.petersr.github.io
  resources:
  - clusteraccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - simplycom.petersr.github.io
  resources:
  - clusteraccounts/status
  verbs:
  - get
