# This rule is not used by the project simply-com-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over simplycom.petersr.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: simply-com-operator
    app.kubernetes.io/managed-by: kustomize
  name: clusteraccount-admin-role
rules:
- apiGroups:
  - simplycom.petersr.github.io
  resources:
  - clusteraccounts
  verbs:
  - '*'
- apiGroups:
  - simplycom.petersr.github.io
  resources:
  - clusteraccounts/status
  verbs:
  - get
