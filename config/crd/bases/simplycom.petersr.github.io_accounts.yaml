---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: accounts.simplycom.petersr.github.io
spec:
  group: simplycom.petersr.github.io
  names:
    categories:
    - simplycom
    kind: Account
    listKind: AccountList
    plural: accounts
    singular: account
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Account holds the credentials for one Simply.com account, usable
          by objects in its own namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NamespacedAccountSpec is the desired state of an Account.
            properties:
              allowAdopt:
                description: |-
                  allowAdopt lets objects using this account take over existing records that the operator did
                  not create (DNSRecord spec.adopt). Off by default, so that whoever may create objects cannot
                  take over, and later delete, records made by hand.
                type: boolean
              apiKeySecretRef:
                description: |-
                  apiKeySecretRef points at the Secret, in the Account's namespace, holding a Simply.com API key.
                  Create one under Account, API keys in the Simply.com control panel.
                properties:
                  key:
                    description: key in the Secret that holds the value. Defaults
                      to apiKey.
                    type: string
                  name:
                    description: name of the Secret.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              zones:
                description: |-
                  zones, when set, are the only Simply.com products (domain names, such as example.com) that
                  objects using this account may change. Empty means every product the API key can reach.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
            required:
            - apiKeySecretRef
            type: object
          status:
            description: AccountStatus is the observed state of an Account or ClusterAccount.
            properties:
              conditions:
                description: conditions; Ready is True once the API key has been accepted
                  by Simply.com.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastCheckedTime:
                description: lastCheckedTime is when the API key was last checked
                  against Simply.com.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the generation the status was computed
                  from.
                format: int64
                type: integer
              products:
                description: products are the product handles (domain names) the API
                  key can reach, as of lastCheckedTime.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
