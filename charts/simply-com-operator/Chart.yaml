apiVersion: v2
name: simply-com-operator
description: Manage Simply.com DNS records as Kubernetes resources
type: application
# The release workflow sets version and appVersion from the tag.
version: 0.3.0
appVersion: "0.3.0"
kubeVersion: ">=1.29.0-0"
home: https://github.com/PeterSR/simply-com-operator
sources:
  - https://github.com/PeterSR/simply-com-operator
maintainers:
  - name: Peter Severin Rasmussen
    url: https://github.com/PeterSR
keywords:
  - simply.com
  - dns
  - operator
  - crd
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: networking
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: simply-com-operator
      image: ghcr.io/petersr/simply-com-operator:v0.3.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/PeterSR/simply-com-operator
    - name: changelog
      url: https://github.com/PeterSR/simply-com-operator/blob/main/CHANGELOG.md
  artifacthub.io/operator: "true"
  artifacthub.io/crds: |
    - kind: DNSRecord
      version: v1alpha1
      name: dnsrecords.simplycom.petersr.github.io
      displayName: DNSRecord
      description: One record in a DNS zone hosted at Simply.com
    - kind: ClusterAccount
      version: v1alpha1
      name: clusteraccounts.simplycom.petersr.github.io
      displayName: ClusterAccount
      description: Simply.com credentials usable from every namespace
    - kind: Account
      version: v1alpha1
      name: accounts.simplycom.petersr.github.io
      displayName: Account
      description: Simply.com credentials usable from one namespace
