# Every optional part switched on.
ownerID: cluster-a
rbac:
  aggregateToDefaultRoles: true
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
extraArgs: ["--zone-cache-ttl=5s"]
extraObjects:
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: '{{ .Release.Name }}-extra'
    namespace: '{{ .Release.Namespace }}'
  data:
    note: rendered through tpl
