# Default values for simply-com-operator.

image:
  repository: ghcr.io/petersr/simply-com-operator
  # Defaults to v<appVersion>.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Only one replica works at a time (leader election); more give faster failover.
replicaCount: 1

crds:
  # Install the CustomResourceDefinitions with the chart.
  install: true
  # Keep the CustomResourceDefinitions, and with them every DNSRecord, when the chart is uninstalled.
  keep: true

# Required. Identifies this installation in the ownership marker the operator writes into the
# comment of every record it manages. Every installation that may share a Simply.com zone, including
# a cluster restored from another's backup, must have its own, such as the cluster's name. Records
# keep the id they were created with, so choose it once. Quote it if it looks like a number.
ownerID: ""

# Simply.com API settings.
simplyAPI:
  url: https://api.simply.com/2
  # Most requests per second to Simply.com, for the whole operator.
  rateLimit: 5
  burst: 10

# How often a record in sync is checked again, to undo changes made outside Kubernetes.
resyncInterval: 10m
# How long to wait after a problem only the user or Simply.com can fix.
retryInterval: 1m
# How often an account's API key is checked again.
accountCheckInterval: 1h

rbac:
  # Add DNSRecord and Account permissions to the built-in admin, edit and view ClusterRoles. Anyone
  # who can then create a DNSRecord can change the zones of every account their namespace may use,
  # so restrict ClusterAccounts with allowedNamespaces or namespaceSelector before turning this on.
  aggregateToDefaultRoles: false

logLevel: info

metrics:
  enabled: false
  port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

# Extra command-line arguments for the manager.
extraArgs: []
# Extra environment variables for the manager.
extraEnv: []
