{{- if .Values.clusterAccount.create }}
apiVersion: simplycom.petersr.github.io/v1alpha1
kind: ClusterAccount
metadata:
  name: {{ .Values.clusterAccount.name }}
  labels:
    {{- include "simply-com-operator.labels" . | nindent 4 }}
  # A hook, so it is created after the CustomResourceDefinitions in the same release exist.
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  apiKeySecretRef:
    name: {{ required "clusterAccount.secretName is required" .Values.clusterAccount.secretName }}
    namespace: {{ .Release.Namespace }}
    key: {{ .Values.clusterAccount.secretKey }}
  {{- with .Values.clusterAccount.zones }}
  zones:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
